<!doctype html>
<html lang="zh-CN">
  <body style="margin: 0; background: #f2eee4; color: #171713">
    <main
      style="
        max-width: 560px;
        margin: 0 auto;
        padding: 56px 32px;
        font-family: Arial, sans-serif;
      "
    >
      <p style="font-size: 11px; font-weight: 700; letter-spacing: 0.18em">
        AI FASHION DESIGN / SECURE ENTRY
      </p>
      <h1
        style="
          margin: 48px 0 16px;
          font-family: Georgia, serif;
          font-size: 42px;
        "
      >
        回到设计台
      </h1>
      <p style="margin: 0 0 32px; color: #635f55; line-height: 1.7">
        点击下方按钮完成一次性邮箱登录。该链接将在使用后失效。
      </p>
      <a
        href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
        style="
          display: inline-block;
          padding: 16px 24px;
          background: #171713;
          color: #ffffff;
          font-weight: 700;
          text-decoration: none;
        "
      >
        安全进入平台
      </a>
      <p
        style="
          margin-top: 32px;
          color: #817b6f;
          font-size: 12px;
          line-height: 1.6;
        "
      >
        如果你没有请求此邮件，可以直接忽略。
      </p>
    </main>
  </body>
</html>
