name: CI

on:
  pull_request:
  push:

jobs:
  quality:
    name: quality + integration + browser contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      API_INTERNAL_URL: http://127.0.0.1:3001
      APP_ORIGIN: http://localhost:3000
      ASSET_CDN_ORIGIN: http://127.0.0.1:9000/fashion-assets
      DATABASE_URL: postgresql://fashion:fashion_dev@localhost:5432/fashion_design?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      S3_ACCESS_KEY_ID: fashion_minio
      S3_BUCKET: fashion-assets
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_HEALTHCHECK_OBJECT_KEY: .health/ready
      S3_REGION: us-east-1
      S3_SECRET_ACCESS_KEY: fashion_minio_dev_secret
      EXPORT_PDF_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      EXPORT_PDF_FONT_FAMILY: NotoSansCJKsc-Regular
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure official Ubuntu mirrors
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-security-mirrors.txt
          sudo tee /etc/apt/apt.conf.d/80-ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF

      - name: Restore export font
        id: export-font
        uses: actions/cache@v4
        with:
          path: ~/.cache/fashion-ci/fonts
          key: ubuntu-24.04-noto-cjk-regular-v1

      - name: Install export font
        timeout-minutes: 5
        run: |
          font_cache="$HOME/.cache/fashion-ci/fonts/NotoSansCJK-Regular.ttc"
          if [ ! -s "$font_cache" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
            mkdir -p "$(dirname "$font_cache")"
            cp "$EXPORT_PDF_FONT_PATH" "$font_cache"
          fi
          sudo install -D -m 644 "$font_cache" "$EXPORT_PDF_FONT_PATH"
          test -s "$EXPORT_PDF_FONT_PATH"

      - name: Audit production and development dependencies
        run: pnpm audit:all

      - name: Test local startup port handling
        run: pnpm test:startup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate database schema
        run: pnpm db:validate

      - name: Start integration infrastructure
        run: |
          docker compose up -d --wait postgres redis minio
          docker compose run --rm minio-init

      - name: Apply migrations to ephemeral database
        run: pnpm db:deploy

      - name: Test applications and workers
        run: pnpm test

      - name: Test database package
        run: pnpm db:test

      - name: Verify private file pipeline
        run: pnpm verify:file-pipeline

      - name: Build production artifacts
        run: pnpm build

      - name: Test runway Python contracts and media processing
        run: pnpm runway:test

      - name: Test runway persistence and private storage in isolation
        run: pnpm runway:test:integration

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ubuntu-24.04-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-headless

      - name: Install Playwright browser
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run browser contract tests
        run: pnpm test:e2e

      - name: Compare Atelier screenshots in pinned Chromium environment
        run: pnpm test:e2e:visual

      - name: Run isolated real application browser flow
        run: pnpm test:e2e:real

      - name: Save browser and application diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-diagnostics
          path: |
            output/playwright/
            output/trial-runtime/*.log
          retention-days: 7

      - name: Stop integration infrastructure
        if: always()
        run: docker compose down -v
