name: new-fashion-design

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fashion_design}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fashion} -d ${POSTGRES_DB:-fashion_design}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fashion_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-fashion_minio_dev_secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        printf 'ready\n' | mc pipe "local/$${S3_BUCKET}/$${S3_HEALTHCHECK_OBJECT_KEY}" &&
        mc anonymous set none "local/$${S3_BUCKET}/thumbnails" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fashion_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-fashion_minio_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-fashion-assets}
      S3_HEALTHCHECK_OBJECT_KEY: ${S3_HEALTHCHECK_OBJECT_KEY:-.health/ready}

volumes:
  minio_data:
  postgres_data:
  redis_data:
