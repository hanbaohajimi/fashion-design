name: new-fashion-design

# The original MinIO registry images are no longer available. Build the same
# releases from official GitHub assets and verify their published SHA-256 hashes.
x-minio-build: &minio-build
  context: .
  dockerfile_inline: |
    FROM alpine:3.22 AS download
    ARG TARGETARCH
    RUN apk add --no-cache ca-certificates curl
    RUN set -eux; \
        case "$${TARGETARCH}" in \
          amd64) minio_sha=53e2a2cb16c5366ea6fbbc479c19ddb4c6a0948273e752f740fb1fbf27bb817c; mc_sha=ac90da87a35641be5a0ac75d49de5161ddb47d629b5ba01261b0ae9e00aea15f ;; \
          arm64) minio_sha=6c2f3142c94240206123177f4ba1e360daa5d1e0a4962e90757ef4f92c3ab57c; mc_sha=61bb88e7435919834478ddd4d405a6de6d2c227079da5e8ee9655147398819a0 ;; \
          *) echo "Unsupported MinIO architecture: $${TARGETARCH}" >&2; exit 1 ;; \
        esac; \
        curl --fail --location --retry 3 --output /usr/local/bin/minio \
          "https://github.com/minio/minio/releases/download/RELEASE.2025-04-22T22-12-26Z/minio.linux-$${TARGETARCH}.RELEASE.2025-04-22T22-12-26Z"; \
        curl --fail --location --retry 3 --output /usr/local/bin/mc \
          "https://github.com/minio/mc/releases/download/RELEASE.2025-04-16T18-13-26Z/mc.linux-$${TARGETARCH}.RELEASE.2025-04-16T18-13-26Z"; \
        printf '%s  /usr/local/bin/minio\n%s  /usr/local/bin/mc\n' "$${minio_sha}" "$${mc_sha}" | sha256sum -c -; \
        chmod +x /usr/local/bin/minio /usr/local/bin/mc
    FROM alpine:3.22
    RUN apk add --no-cache ca-certificates
    COPY --from=download /usr/local/bin/minio /usr/local/bin/mc /usr/local/bin/
    ENTRYPOINT ["minio"]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fashion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fashion_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fashion_design}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fashion} -d ${POSTGRES_DB:-fashion_design}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    build: *minio-build
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fashion_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-fashion_minio_dev_secret}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data

  minio-init:
    build: *minio-build
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        printf 'ready\n' | mc pipe "local/$${S3_BUCKET}/$${S3_HEALTHCHECK_OBJECT_KEY}" &&
        mc anonymous set none "local/$${S3_BUCKET}/thumbnails" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fashion_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-fashion_minio_dev_secret}
      S3_BUCKET: ${S3_BUCKET:-fashion-assets}
      S3_HEALTHCHECK_OBJECT_KEY: ${S3_HEALTHCHECK_OBJECT_KEY:-.health/ready}

  runway-worker:
    profiles: ["runway"]
    build:
      context: ./apps/runway
      target: runtime
    image: fashion-runway:local
    command: ["python", "-m", "runway", "worker"]
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: &runway-environment
      RUNWAY_ENABLED: ${RUNWAY_ENABLED:-false}
      RUNWAY_PROVIDER_MODE: ${RUNWAY_PROVIDER_MODE:-mock}
      RUNWAY_DATABASE_URL: ${RUNWAY_CONTAINER_DATABASE_URL:-postgresql://${POSTGRES_USER:-fashion}:${POSTGRES_PASSWORD:-fashion_dev}@postgres:5432/${POSTGRES_DB:-fashion_design}}
      RUNWAY_CHECKPOINT_SCHEMA: ${RUNWAY_CHECKPOINT_SCHEMA:-runway_checkpoints}
      RUNWAY_WORKER_CONCURRENCY: ${RUNWAY_WORKER_CONCURRENCY:-1}
      RUNWAY_TEMP_DIR: /tmp/runway
      RUNWAY_FFMPEG_PATH: ffmpeg
      RUNWAY_FFPROBE_PATH: ffprobe
      RUNWAY_LLM_BASE_URL: ${RUNWAY_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      RUNWAY_LLM_MODEL: ${RUNWAY_LLM_MODEL:-openai/gpt-4o}
      RUNWAY_LLM_API_KEY: ${RUNWAY_LLM_API_KEY:-}
      RUNWAY_IMAGE_BASE_URL: ${RUNWAY_IMAGE_BASE_URL:-https://api.closeai-proxy.xyz/google}
      RUNWAY_IMAGE_MODEL: ${RUNWAY_IMAGE_MODEL:-google/gemini-3-pro-image}
      RUNWAY_IMAGE_API_KEY: ${RUNWAY_IMAGE_API_KEY:-}
      RUNWAY_VISION_BASE_URL: ${RUNWAY_VISION_BASE_URL:-https://api.closeai-proxy.xyz/v1}
      RUNWAY_VISION_MODEL: ${RUNWAY_VISION_MODEL:-gpt-4o}
      RUNWAY_VISION_API_KEY: ${RUNWAY_VISION_API_KEY:-}
      RUNWAY_VIDEO_PROVIDER: jimeng
      RUNWAY_VOLC_AK: ${RUNWAY_VOLC_AK:-}
      RUNWAY_VOLC_SK: ${RUNWAY_VOLC_SK:-}
      RUNWAY_VIDEO_REQ_KEY: ${RUNWAY_VIDEO_REQ_KEY:-jimeng_i2v_first_v30}
      RUNWAY_VIDEO_FRAMES: ${RUNWAY_VIDEO_FRAMES:-121}
      RUNWAY_VIDEO_TIMEOUT_SECONDS: ${RUNWAY_VIDEO_TIMEOUT_SECONDS:-900}
      RUNWAY_POLL_INTERVAL_SECONDS: ${RUNWAY_POLL_INTERVAL_SECONDS:-3}
      RUNWAY_MUSIC_BASE_URL: ${RUNWAY_MUSIC_BASE_URL:-https://api.minimaxi.com}
      RUNWAY_MUSIC_MODEL: ${RUNWAY_MUSIC_MODEL:-music-2.6}
      RUNWAY_MUSIC_API_KEY: ${RUNWAY_MUSIC_API_KEY:-}
      RUNWAY_REQUEST_TIMEOUT_SECONDS: ${RUNWAY_REQUEST_TIMEOUT_SECONDS:-180}
      LANGSMITH_TRACING: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-fashion-assets}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-fashion_minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-fashion_minio_dev_secret}
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      - runway_cache:/tmp/runway
    healthcheck:
      test: ["CMD", "python", "-m", "runway", "health"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 4
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  runway-tests:
    profiles: ["runway-test"]
    build:
      context: ./apps/runway
      target: test
    image: fashion-runway-test:local
    environment:
      <<: *runway-environment
      RUNWAY_INTEGRATION: "1"
    command: ["python", "-m", "pytest", "-q", "-m", "integration"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  minio_data:
  postgres_data:
  redis_data:
  runway_cache:
